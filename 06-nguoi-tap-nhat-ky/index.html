<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="FitPlan Studio - nhật ký tập của người tập">
  <title>Nhật ký tập | FitPlan Studio</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <a class="logo" href="../01-trang-chu/index.html">FitPlan Studio</a>
    <nav class="main-nav" aria-label="Menu người tập">
      <ul>
        <li><a class="tab" href="../04-nguoi-tap-dashboard/index.html">Dashboard</a></li>
        <li><a class="tab" href="../05-nguoi-tap-ke-hoach/index.html">Kế hoạch</a></li>
        <li><a class="tab active" href="index.html" aria-current="page">Nhật ký</a></li>
      </ul>
    </nav>
    <div class="user-box">
      <span>Nguyễn Văn An · Người tập</span>
      <select class="role-switch" id="roleSwitch" aria-label="Chuyển vai trò nhanh" title="Chuyển vai trò nhanh"><option value="../04-nguoi-tap-dashboard/index.html" selected>Người tập</option><option value="../07-coach-hoc-vien/index.html">Huấn luyện viên</option><option value="../10-cong-dong-challenge/index.html">Điều phối cộng đồng</option><option value="../13-admin-bai-tap/index.html">Quản trị viên</option></select>
      <button type="button" class="btn btn-ghost" id="logoutBtn">Đăng xuất</button>
    </div>
  </header>

  <main class="container">
    <section class="page-title">
      <h1>Nhật ký tập</h1>
      <p>Ghi nhận buổi tập đã thực hiện</p>
    </section>


    <section class="card-box" aria-label="Biểu mẫu buổi tập">
      <h2 id="formTitle">Thêm buổi tập</h2>
      <form id="itemForm" novalidate>
        <div class="form-grid">
        <div class="field">
          <label for="f_d">Ngày</label>
          <input type="date" id="f_d" name="d">
          <span class="error-text" id="err_d"></span>
        </div>
        <div class="field">
          <label for="f_ex">Bài tập</label>
          <input type="text" id="f_ex" name="ex">
          <span class="error-text" id="err_ex"></span>
        </div>
        <div class="field">
          <label for="f_ok">Kết quả</label>
          <select id="f_ok" name="ok"><option value="Xong">Xong</option><option value="Bỏ dở">Bỏ dở</option></select>
          <span class="error-text" id="err_ok"></span>
        </div>
        </div>
        <button type="submit" class="btn btn-primary" id="submitBtn">Thêm</button>
        <button type="button" class="btn btn-ghost" id="cancelBtn" hidden>Hủy</button>
      </form>
    </section>

    <section id="itemList" aria-label="Danh sách buổi tập"></section>
  </main>

  <div class="toast" id="toast" role="status"></div>

  <footer class="site-footer">
    <p>FitPlan Studio — BTL-29 ·
      <label class="fail-toggle"><input type="checkbox" id="failToggle"> Giả lập lỗi tải (xem trạng thái lỗi)</label>
    </p>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
