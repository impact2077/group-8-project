<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>FitPlan Studio</title>
<style>
:root{--p:#0d9488;--p2:#38bdf8;--ink:#12303a;--mu:#5a7580;--bg:#fbfeff;--cd:#fff;--bd:#e1eff2;--soft:#f0fafb;--ok:#2f9e5a;--okb:#e8f8ee;--er:#c0392b;--erb:#fdecea;--wa:#b8860b;--wab:#fff4dd;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#eaf6f8;--mu:#9fbac2;--bg:#0e1a1d;--cd:#14262a;--bd:#223a40;--soft:#16303a;--okb:#14301f;--erb:#3a1a16;--wab:#33290f}}
:root[data-theme="dark"]{--ink:#eaf6f8;--mu:#9fbac2;--bg:#0e1a1d;--cd:#14262a;--bd:#223a40;--soft:#16303a;--okb:#14301f;--erb:#3a1a16;--wab:#33290f}
*{box-sizing:inherit;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:'Segoe UI',Arial,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--cd);border-bottom:1px solid var(--bd);padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.logo{color:var(--p);cursor:pointer;font-size:1.1rem}header nav{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tab{border:1px solid var(--bd);background:var(--cd);color:var(--ink);padding:6px 12px;border-radius:999px;font-size:.8rem;cursor:pointer}.tab.on{background:var(--p);color:#fff;border-color:var(--p)}
main{max-width:960px;margin:0 auto;padding:16px}
footer{text-align:center;padding:18px;color:var(--mu);font-size:.78rem}
.top{background:linear-gradient(135deg,#e4f8f4,#e3f3fd);border:1px solid var(--bd);border-radius:12px;padding:16px 18px;margin-bottom:14px;color:#12303a}.top h1{font-size:1.25rem;color:#0d9488}.top p{font-size:.85rem;margin-top:3px;color:#456}
.hero{background:linear-gradient(135deg,#e4f8f4,#e3f3fd);border-radius:14px;padding:44px 26px;margin-bottom:14px;color:#12303a}.hero h1{font-size:2rem;line-height:1.15;margin:6px 0 10px;color:#0d9488}.hero p{max-width:440px;margin-bottom:16px;color:#456}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-bottom:14px}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:10px;padding:14px;box-shadow:0 1px 3px rgba(0,0,0,.05)}.card h3{font-size:.95rem;margin-bottom:6px}.card ul,.mb ul{padding-left:18px;font-size:.85rem;line-height:1.6}
.mu,.card p{color:var(--mu);font-size:.82rem;line-height:1.5}
.stat{background:var(--cd);border:1px solid var(--bd);border-radius:10px;padding:14px}.stat b{display:block;font-size:1.5rem;color:var(--p)}.stat span{font-size:.78rem;color:var(--mu)}
.btn{border:1px solid var(--p);background:var(--cd);color:var(--p);padding:7px 14px;border-radius:6px;font-size:.82rem;cursor:pointer;margin:2px 0}.btn.pr{background:var(--p);color:#fff}.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}.btn.er{background:var(--er);border-color:var(--er);color:#fff}.btn.gh{border-color:var(--bd);color:var(--mu)}.btn:disabled{opacity:.6}
.b{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.72rem;font-weight:700}.b.wa{background:var(--wab);color:var(--wa)}.b.er{background:var(--erb);color:var(--er)}.b.ok{background:var(--okb);color:var(--ok)}.b.gr{background:var(--bg);color:var(--mu);border:1px solid var(--bd)}
label{display:flex;flex-direction:column;gap:3px;font-size:.8rem;color:var(--mu);margin-bottom:10px}
input,select,textarea{padding:8px 10px;border:1px solid var(--bd);border-radius:6px;background:var(--cd);color:var(--ink);font:inherit;font-size:.88rem}
.err{color:var(--er);font-size:.76rem;margin-bottom:8px;display:block}
.sb{background:var(--soft);border:1px dashed var(--p2);border-radius:10px;padding:14px;text-align:center;color:var(--mu);font-size:.85rem;margin-bottom:14px}.sb .btn{margin-left:8px}
.ai{background:var(--soft);border:1px dashed var(--p2);border-radius:10px;padding:12px;font-size:.84rem;margin-bottom:8px}
.wrap{overflow-x:auto;margin-bottom:14px}table{width:100%;border-collapse:collapse;background:var(--cd);border:1px solid var(--bd);font-size:.82rem}th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--bd)}th{color:var(--mu);font-size:.72rem;text-transform:uppercase}
.bar{height:10px;background:var(--bd);border-radius:6px;overflow:hidden;margin:3px 0 8px}.bar i{display:block;height:100%;background:var(--p2)}
.auth{max-width:380px;margin:20px auto}form.card{margin-bottom:14px}
.ov{position:fixed;inset:0;background:rgba(10,30,35,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}.mb{background:var(--cd);border-radius:12px;padding:22px;width:100%;max-width:480px;max-height:85vh;overflow-y:auto;position:relative}.mb h3{margin:14px 0 6px;font-size:.95rem}.x{position:absolute;top:10px;right:14px;background:none;border:0;font-size:1.4rem;cursor:pointer;color:var(--mu)}
.tt{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--p);color:#fff;padding:9px 18px;border-radius:999px;font-size:.82rem;opacity:0;pointer-events:none;z-index:20}.tt.on{opacity:1}
</style>
</head>
<body>
<div id="app"></div><div id="tt" class="tt"></div>
<script>
const $=s=>document.querySelector(s),dt=n=>{const d=new Date();d.setDate(d.getDate()-n);return d.toISOString().slice(0,10)};
let U=null,S='index',q='',ed={},er={},nid=100,ai={},M={goal:'',n:0,plan:null},mod=null,rev={},fail=false,bz=false,tk=0;
const RL={member:'Người tập',coach:'Huấn luyện viên',community:'Điều phối cộng đồng',admin:'Quản trị viên'};
const NAV={member:[['dash','Dashboard'],['plan','Kế hoạch'],['log','Nhật ký']],coach:[['members','Học viên'],['review','Duyệt kế hoạch'],['tpl','Template']],community:[['chal','Challenge'],['board','Leaderboard'],['cnt','Nội dung']],admin:[['ex','Bài tập'],['users','Người dùng'],['stats','Analytics']]};
const ST={pending:['wa','Đang chờ'],rejected:['er','Bị từ chối'],completed:['ok','Hoàn thành'],archived:['gr','Đã huỷ']};
const G={'Giảm cân':['Cardio','Chân','Bụng'],'Tăng cơ':['Ngực','Lưng','Chân'],'Duy trì':['Cardio','Bụng']},GO=['',...Object.keys(G)];
const D={
users:[{id:1,name:'Nguyễn Văn An',email:'an@mail.com',role:'Người tập',arch:false},{id:2,name:'Coach Hùng',email:'hung@mail.com',role:'Huấn luyện viên',arch:false},{id:3,name:'Lan Điều Phối',email:'lan@mail.com',role:'Điều phối cộng đồng',arch:false},{id:4,name:'Admin',email:'admin@mail.com',role:'Quản trị viên',arch:false}],
mem:[{id:1,name:'Nguyễn Văn An',goal:'Giảm cân',n:4},{id:2,name:'Trần Thị Bình',goal:'Tăng cơ',n:5},{id:3,name:'Lê Minh Cường',goal:'Duy trì',n:3},{id:4,name:'Phạm Thu Hà',goal:'Tăng cơ',n:4}],
ml:{1:[1,1,1,1,0],2:[0,0,0,1],3:[1,1],4:[1,0,1,0]},
log:[{id:1,d:dt(0),ex:'Squat 3x12',ok:'Xong'},{id:2,d:dt(1),ex:'Plank 3x30s',ok:'Xong'},{id:3,d:dt(2),ex:'Chạy 20 phút',ok:'Xong'},{id:4,d:dt(5),ex:'Chạy 20 phút',ok:'Bỏ dở'}],
plans:[{id:1,m:'Nguyễn Văn An',t:'Kế hoạch giảm cân — Tuần 3',it:['Squat — 3 hiệp x 12','Plank — 3 hiệp x 30 giây','Chạy bộ — 20 phút'],st:'pending'},{id:2,m:'Trần Thị Bình',t:'Kế hoạch tăng cơ — Tuần 2',it:['Đẩy tạ ngực — 4 hiệp x 8','Kéo xà — 3 hiệp x 10'],st:'rejected'},{id:3,m:'Lê Minh Cường',t:'Kế hoạch duy trì — Tuần 1',it:['Chạy bộ — 30 phút','Giãn cơ — 10 phút'],st:'completed'},{id:4,m:'Phạm Thu Hà',t:'Kế hoạch tăng cơ — Tuần 4',it:['Deadlift — 4 hiệp x 6','Plank — 3 hiệp x 45 giây'],st:'archived'}],
tpl:[{id:1,name:'Squat',group:'Chân',sets:3,reps:12},{id:2,name:'Plank',group:'Bụng',sets:3,reps:30},{id:3,name:'Chạy bộ',group:'Cardio',sets:1,reps:20},{id:4,name:'Đẩy tạ ngực',group:'Ngực',sets:4,reps:8},{id:5,name:'Kéo xà',group:'Lưng',sets:3,reps:10}],
chal:[{id:1,name:'30 ngày plank',period:'01–30/10',part:54,arch:false},{id:2,name:'10K bước mỗi ngày',period:'Tuần này',part:41,arch:false},{id:3,name:'Thử thách hè',period:'Tháng 8',part:33,arch:true}],
board:[{id:1,name:'Nguyễn Văn An',score:980,hide:0},{id:2,name:'Trần Thị Bình',score:910,hide:0},{id:3,name:'Lê Minh Cường',score:905,hide:0}],
cnt:[{id:1,title:'5 cách giữ thói quen tập',body:'Đặt lịch cố định, bắt đầu nhỏ, ghi log mỗi buổi.'},{id:2,title:'Ngủ đủ giấc để tăng cơ',body:'Cơ phục hồi tốt nhất khi ngủ 7–8 tiếng mỗi đêm.'}],
ex:[{id:1,name:'Squat',group:'Chân',lvl:'Cơ bản',arch:false},{id:2,name:'Plank',group:'Bụng',lvl:'Cơ bản',arch:false},{id:3,name:'Burpee',group:'Toàn thân',lvl:'Nâng cao',arch:true}]};
const DEF={chal:{part:0,arch:false},ex:{arch:false},users:{arch:false}},FS={};
const h=(t,s)=>`<div class=top><h1>${t}</h1><p>${s}</p></div>`,bd=(c,t)=>`<span class="b ${c}">${t}</span>`,bx=(m,x='')=>`<div class=sb>${m}${x}</div>`;
const bt=(t,a,i='',c='',k='')=>`<button type=button class="btn ${c}" data-a="${a}" data-i="${i}" data-k="${k}">${t}</button>`;
const card=(t,b)=>`<div class=card><h3>${t}</h3>${b}</div>`,stat=(n,l)=>`<div class=stat><b>${n}</b><span>${l}</span></div>`;
const fld=(f,v,e)=>`<label>${f.l}${f.t=='select'?`<select name=${f.n}>${f.o.map(o=>`<option value="${o}" ${o==v?'selected':''}>${o||'— Chọn —'}</option>`).join('')}</select>`:f.t=='area'?`<textarea name=${f.n} rows=3>${v||''}</textarea>`:`<input name=${f.n} type=${f.t||'text'} value="${v??''}">`}${e?`<span class=err>${e}</span>`:''}</label>`;
function mgr(k,t,fs,cols,o={}){FS[k]=fs;const e=ed[k]!=null?D[k].find(x=>x.id==ed[k]):null,r=D[k];
return `<form class=card data-f=${k}><h3>${e?'Sửa':'Thêm'} ${t}</h3>${fs.map(f=>fld(f,e?e[f.n]:f.d,er[k]&&er[k][f.n])).join('')}<button class="btn pr">${e?'Lưu':'Thêm'}</button> ${e?bt('Huỷ','cancel','','gh',k):''}</form>`+(r.length?`<div class=wrap><table><tr>${cols.map(c=>`<th>${c[0]}`).join('')}<th></tr>${r.map(x=>`<tr>${cols.map(c=>`<td>${c[1](x)}`).join('')}<td>${bt('Sửa','edit',x.id,'',k)} ${o.arch?bt(x.arch?'Khôi phục':'Lưu trữ','arch',x.id,'gh',k):bt('Xoá','del',x.id,'er',k)}</tr>`).join('')}</table></div>`:bx(o.empty))}
const stb=x=>bd(x.arch?'gr':'ok',x.arch?'Lưu trữ':'Hoạt động');
const streak=()=>{const s=new Set(D.log.filter(x=>x.ok=='Xong').map(x=>x.d));let n=0,i=s.has(dt(0))?0:1;while(s.has(dt(i))){n++;i++}return n};
const ai2v=()=>{const p=ai.i||{};if(p.s=='run')return 'Đang xử lý...';if(p.s=='skip')return `<p class=mu>Đã bỏ qua insight.</p>${bt('Hiện lại','re2','','gh')}`;if(p.s=='fail')return bx('Chưa đủ log để phân tích pattern.',bt('Bỏ qua','sk2','','gh')+bt('Thử lại sau','re2'));const L=D.log,pc=Math.round(L.filter(x=>x.ok=='Xong').length/L.length*100);return `<div class=ai>${pc>=80?'Bạn đang duy trì rất tốt.':pc>=50?'Khá ổn, thử thêm 1 buổi mỗi tuần.':'Cần cải thiện: hãy đặt lịch tập cố định.'}<p class=mu>Dựa trên ${L.length} buổi log, hoàn thành ${pc}%.</p></div>${bt('Bỏ qua','sk2','','gh')} ${bt('Thử lại','re2')}`};
const onb=`<div class=ov><div class=mb><h2>Thiết lập mục tiêu</h2><p class=mu>Cho chúng tôi biết để gợi ý kế hoạch phù hợp.</p><br><form data-f=onb>${fld({n:'goal',l:'Mục tiêu',t:'select',o:GO},'',er.onb&&er.onb.goal)}${fld({n:'n',l:'Số buổi/tuần',t:'number'},'',er.onb&&er.onb.n)}<button class="btn pr">Bắt đầu</button></form></div></div>`;
const ai1v=()=>{const p=ai.p;if(!p)return '<p class=mu>Chọn mục tiêu rồi bấm "AI gợi ý kế hoạch".</p>';if(p.s=='run')return 'Đang xử lý...';if(p.s=='fail')return bx('Không đủ dữ liệu để đề xuất.',bt('Thử lại','re1')+bt('Dùng thủ công','man'));if(p.s=='ok')return `<div class=ai><b>Gợi ý cho "${p.g}", ${p.n} buổi/tuần:</b><ul>${p.it.map(i=>`<li>${i}`).join('')}</ul><p class=mu>Chọn từ thư viện template theo nhóm cơ phù hợp mục tiêu.</p></div>${bt('Chấp nhận','acc','','ok')} ${bt('Chỉnh sửa','edp')} ${bt('Thử lại','re1','','gh')}`;return `<form data-f=pe>${fld({n:'it',l:'Mỗi dòng một bài tập',t:'area'},(p.it||[]).join('\n'),er.pe)}<button class="btn pr">Lưu và gửi duyệt</button></form>`};
const mlist=()=>{const r=D.mem.filter(m=>m.name.toLowerCase().includes(q.toLowerCase()));return r.length?`<div class=grid>${r.map(m=>card(m.name,`<p>${m.goal} — ${m.n} buổi/tuần</p><br>`+bt('Xem chi tiết','view',m.id))).join('')}</div>`:bx('Không tìm thấy học viên nào.')};
const c3=(c,m)=>{if(c.s=='run'||!c.s)return 'Đang xử lý...';if(c.s=='nodata')return bx('Không đủ dữ liệu để tóm tắt (cần ít nhất 3 buổi).',bt('Thử lại','re3'));if(c.s=='unsure')return bx('AI chưa chắc chắn về tóm tắt này.',bt('Xem log gốc','raw','','gh')+bt('Thử lại','re3')+bt('Báo cáo','rep','','gh'));const g=c.r>=.7;return `<div class=ai>${bd(g?'ok':'wa',g?'Tốt':'Cần chú ý')} Hoàn thành ${Math.round(c.r*100)}% trong ${c.n} buổi gần nhất (mục tiêu ${m.n} buổi/tuần).</div>`};
const modal=()=>{const m=D.mem.find(x=>x.id==mod),L=D.ml[m.id],c=ai.c&&ai.c.id==m.id?ai.c:{};return `<div class=ov><div class=mb><button class=x data-a=close>×</button><h2>${m.name}</h2><p class=mu>${m.goal} — ${m.n} buổi/tuần</p><h3 id=lg>Lịch sử log tập</h3>${fail?bx('Không thể tải log.',bt('Thử lại','r0')):L.length?`<ul>${L.map((o,i)=>`<li>${dt(i*2).slice(5)} — ${o?'Xong':'Bỏ dở'}`).join('')}</ul>`:bx('Chưa có log nào.')}<h3>Tóm tắt AI</h3>${c3(c,m)}</div></div>`};
const REG=[{n:'name',l:'Họ tên',req:1},{n:'email',l:'Email',t:'email',req:1},{n:'pw',l:'Mật khẩu',t:'password',req:1}],ONB=[{n:'goal',l:'Mục tiêu',req:1},{n:'n',l:'Số buổi/tuần',min:1,req:1}];
const VIEW={
index:()=>`<div class=hero><small>FITPLAN STUDIO</small><h1>Cân bằng vóc dáng &amp; thói quen tập luyện</h1><p>Kế hoạch tập gợi ý theo mục tiêu, nhắc duy trì thói quen mỗi ngày, huấn luyện viên đồng hành từ xa.</p>${bt('Bắt đầu ngay','go','register','pr')} ${bt('Đăng nhập','go','login','gh')}</div><div class=grid>${card('Kế hoạch gợi ý','AI đề xuất bài tập theo mục tiêu.')}${card('Theo dõi tiến độ','Insight từ log tập hằng ngày.')}${card('Huấn luyện viên','Xem log và nhận xét từ xa.')}${card('Cộng đồng','Thử thách và bảng xếp hạng.')}</div>`,
login:()=>`<div class=auth>${card('Đăng nhập',`<form data-f=login>${fld({n:'email',l:'Email',t:'email'})}${fld({n:'pw',l:'Mật khẩu',t:'password'})}${fld({n:'role',l:'Vai trò (demo)',t:'select',o:Object.values(RL)})}${er.login?`<span class=err>${er.login}</span>`:''}<button class="btn pr" ${bz?'disabled':''}>${bz?'Đang đăng nhập...':'Đăng nhập'}</button></form><p class=mu><br>Mật khẩu bất kỳ từ 6 ký tự trở lên.</p>`)}</div>`,
register:()=>{const e=er.reg||{};return `<div class=auth>${card('Tạo tài khoản',`<form data-f=register>${REG.map(f=>fld(f,'',e[f.n])).join('')}<button class="btn pr">Đăng ký</button></form>`)}</div>`},
dash:()=>{if(!ai.i){ai.i={s:'run'};setTimeout(()=>{ai.i=D.log.length<3?{s:'fail'}:{s:'ok'};if(S=='dash')draw()},600)}const ok=D.log.filter(x=>x.ok=='Xong'),wk=ok.filter(x=>x.d>=dt(6)).length;return h('Fitness Dashboard','Tổng quan hôm nay')+`<div class=grid>${stat(streak()+' ngày','Streak hiện tại')}${stat(wk+'/'+(M.n||'—'),'Buổi tuần này')}${stat((D.log.length?Math.round(ok.length/D.log.length*100):0)+'%','Hoàn thành')}</div><div class=grid>${card('Kế hoạch hôm nay',M.plan?`<p>${M.plan.it.slice(0,3).join(' · ')}</p>`:'<p>Chưa có kế hoạch. Tạo ở mục Kế hoạch.</p>')}${card('Insight AI',ai2v())}</div>`+(M.goal?'':onb)},
plan:()=>{const m=M.plan,p=m&&D.plans.find(x=>x.id==m.pid);return h('Kế hoạch tập','Tạo hoặc nhận gợi ý từ AI')+`<div class=grid>${card('Mục tiêu',`<form data-f=ai1>${fld({n:'goal',l:'Mục tiêu',t:'select',o:GO},M.goal)}${fld({n:'n',l:'Số buổi/tuần',t:'number'},M.n||'')}<button class="btn pr">AI gợi ý kế hoạch</button> ${bt('Dùng thủ công','man','','gh')}</form>`)}${card('Kết quả gợi ý',ai1v())}</div>`+(m?card('Kế hoạch hiện tại',`<ul>${m.it.map(i=>`<li>${i}`).join('')}</ul><br>${p?bd(...ST[p.st]):''} ${bt('Sửa','edp2','','gh')}`):'')},
log:()=>h('Nhật ký tập','Ghi nhận buổi tập đã thực hiện')+mgr('log','buổi tập',[{n:'d',l:'Ngày',t:'date',req:1,d:dt(0)},{n:'ex',l:'Bài tập',req:1},{n:'ok',l:'Kết quả',t:'select',o:['Xong','Bỏ dở']}],[['Ngày',x=>x.d],['Bài tập',x=>x.ex],['Kết quả',x=>bd(x.ok=='Xong'?'ok':'wa',x.ok)]],{empty:'Chưa có buổi tập nào.'}),
members:()=>h('Danh sách học viên','Xem thông tin và tóm tắt tập luyện')+bx(`Có <b>${D.plans.filter(x=>x.st=='pending').length}</b> kế hoạch chờ duyệt.`,bt('Đi duyệt','go','review','pr'))+`<label>Tìm học viên theo tên<input id=q value="${q}"></label><div id=lst>${mlist()}</div>`,
review:()=>h('Duyệt kế hoạch tập','Phản hồi kế hoạch do học viên gửi')+(D.plans.length?`<div class=grid>${D.plans.map(p=>card(p.m+' — '+p.t,`<ul>${p.it.map(i=>`<li>${i}`).join('')}</ul><br>${bd(...ST[p.st])}${p.note?`<p>Đã yêu cầu sửa: ${p.note}</p>`:''}`+(p.st=='pending'?`<br><br>${bt('Chấp nhận','ac2',p.id,'ok')} ${bt('Từ chối','rj',p.id,'er')} ${bt('Yêu cầu sửa','ask',p.id,'gh')}`+(rev.i==p.id?`<form data-f=fb>${fld({n:'note',l:'Nhận xét cho học viên',t:'area'},'',er.fb)}<button class="btn pr">Gửi yêu cầu sửa</button> ${bt('Huỷ','cx','','gh')}</form>`:''):''))).join('')}</div>`:bx('Chưa có kế hoạch nào cần duyệt.')),
tpl:()=>h('Quản lý template bài tập','Thêm, sửa, xoá bài tập mẫu dùng chung')+mgr('tpl','template',[{n:'name',l:'Tên bài tập',req:1},{n:'group',l:'Nhóm cơ'},{n:'sets',l:'Số hiệp',t:'number',req:1,min:1},{n:'reps',l:'Số lần',t:'number',req:1,min:1}],[['Tên',x=>x.name],['Nhóm cơ',x=>x.group],['Hiệp x lần',x=>x.sets+' x '+x.reps]],{empty:'Chưa có template nào.'}),
chal:()=>h('Challenge','Tổng quan và quản lý thử thách')+`<div class=grid>${stat(D.chal.filter(x=>!x.arch).length,'Đang chạy')}${stat(D.chal.reduce((a,x)=>a+x.part,0),'Lượt tham gia')}${stat(D.chal.filter(x=>x.arch).length,'Đã lưu trữ')}</div>`+mgr('chal','challenge',[{n:'name',l:'Tên challenge',req:1},{n:'period',l:'Thời gian',req:1}],[['Challenge',x=>x.name],['Thời gian',x=>x.period],['Tham gia',x=>x.part],['Trạng thái',x=>bd(x.arch?'gr':'ok',x.arch?'Lưu trữ':'Đang chạy')]],{arch:1,empty:'Chưa có challenge nào.'}),
board:()=>h('Bảng xếp hạng','Theo dõi và điều chỉnh')+`<div class=wrap><table><tr><th>#<th>Thành viên<th>Điểm<th>Trạng thái<th></tr>${[...D.board].sort((a,b)=>b.score-a.score).map((x,i)=>`<tr><td>${i+1}<td>${x.name}<td><input id=sc${x.id} type=number value=${x.score} style=width:80px><td>${bd(x.hide?'gr':'ok',x.hide?'Đã ẩn':'Hợp lệ')}<td>${bt('Lưu điểm','sc',x.id)} ${bt(x.hide?'Hiện':'Ẩn','hd',x.id,'gh')}</tr>`).join('')}</table></div>`,
cnt:()=>h('Nội dung wellness','Bài viết sức khỏe')+mgr('cnt','bài viết',[{n:'title',l:'Tiêu đề',req:1},{n:'body',l:'Nội dung',t:'area',req:1}],[['Tiêu đề',x=>x.title],['Nội dung',x=>x.body.slice(0,50)]],{empty:'Chưa có bài viết nào.'}),
ex:()=>h('Thư viện bài tập','Dữ liệu bài tập gốc')+mgr('ex','bài tập',[{n:'name',l:'Tên bài tập',req:1},{n:'group',l:'Nhóm cơ',req:1},{n:'lvl',l:'Mức độ',t:'select',o:['Cơ bản','Nâng cao']}],[['Bài tập',x=>x.name],['Nhóm cơ',x=>x.group],['Mức độ',x=>x.lvl],['Trạng thái',stb]],{arch:1,empty:'Chưa có bài tập nào.'}),
users:()=>h('Quản lý người dùng','Tài khoản và vai trò')+mgr('users','người dùng',[{n:'name',l:'Họ tên',req:1},{n:'email',l:'Email',t:'email',req:1},{n:'role',l:'Vai trò',t:'select',o:Object.values(RL)}],[['Tên',x=>x.name],['Email',x=>x.email],['Vai trò',x=>x.role],['Trạng thái',x=>bd(x.arch?'er':'ok',x.arch?'Bị khoá':'Hoạt động')]],{arch:1,empty:'Chưa có người dùng nào.'}).replace(/Lưu trữ</g,'Khoá<'),
stats:()=>{const all=[...D.log.map(x=>[x.d,x.ok=='Xong']),...Object.values(D.ml).flatMap(a=>a.map((o,i)=>[dt(i*2),!!o]))],ok=all.filter(x=>x[1]).length,wd=[0,0,0,0,0,0,0];all.forEach(x=>wd[(new Date(x[0]).getDay()+6)%7]++);const mx=Math.max(...wd,1);return h('Fitness Analytics','Tổng quan và báo cáo toàn hệ thống')+`<div class=grid>${stat(D.users.length,'Người dùng')}${stat(all.length,'Buổi tập đã ghi')}${stat((all.length?Math.round(ok/all.length*100):0)+'%','Tỉ lệ hoàn thành')}</div>`+card('Buổi tập theo thứ trong tuần',wd.map((v,i)=>`<div class=mu>${['T2','T3','T4','T5','T6','T7','CN'][i]} · ${v}</div><div class=bar><i style="width:${v/mx*100}%"></i></div>`).join(''))}};
const head=()=>`<header><b class=logo data-a=go data-i=index>FitPlan Studio</b><nav>${U?NAV[U.role].map(n=>`<button class="tab ${n[0]==S?'on':''}" data-a=go data-i=${n[0]}>${n[1]}</button>`).join('')+`<span class=mu>${U.name} · ${RL[U.role]}</span>`+bt('Đăng xuất','out','','gh'):bt('Đăng nhập','go','login','gh')+bt('Đăng ký','go','register','pr')}</nav></header>`;
const foot=()=>`<footer>FitPlan Studio — BTL-29 · <label style="display:inline-flex;flex-direction:row;gap:4px"><input type=checkbox id=fl ${fail?'checked':''}> Giả lập lỗi tải (xem trạng thái lỗi)</label></footer>`;
function draw(l){const t=++tk,rs=U&&NAV[U.role].some(n=>n[0]==S);$('#app').innerHTML=head()+'<main id=v></main>'+foot();const m=$('#v'),fill=()=>{if(t!=tk)return;m.innerHTML=rs&&fail?bx('Không thể tải dữ liệu. Vui lòng thử lại.',bt('Thử lại','r0')):VIEW[S]()+(mod&&rs&&!fail?modal():'')};l&&rs?(m.innerHTML=bx('Đang tải...'),setTimeout(fill,300)):fill()}
function go(s){if(!['index','login','register'].includes(s)&&!U)s='login';S=s;q='';ed={};er={};rev={};mod=null;draw(true);scrollTo(0,0)}
let tm;const toast=m=>{const e=$('#tt');e.textContent=m;e.className='tt on';clearTimeout(tm);tm=setTimeout(()=>e.className='tt',1800)};
function ai1(d){M.goal=d.goal||M.goal;M.n=+d.n||M.n;ai.last=d;if(!d.goal||!(+d.n>0)){ai.p={s:'fail'};return draw()}ai.p={s:'run'};draw();setTimeout(()=>{const it=D.tpl.filter(t=>G[d.goal].includes(t.group)).slice(0,+d.n).map(t=>`${t.name} — ${t.sets} hiệp x ${t.reps}`);ai.p=it.length?{s:'ok',it,g:d.goal,n:+d.n}:{s:'fail'};if(S=='plan')draw()},600)}
function ai3(id){ai.c={id,s:'run'};draw();setTimeout(()=>{const L=D.ml[id],r=L.filter(x=>x).length/(L.length||1);ai.c={id,n:L.length,r,s:L.length<3?'nodata':r>=.4&&r<=.6?'unsure':'ok'};if(mod==id)draw()},600)}
const sst=(i,s)=>{D.plans.find(p=>p.id==i).st=s;toast('Đã cập nhật kế hoạch');draw()};
const A={go:i=>go(i),out:()=>{U=null;go('index')},r0:()=>draw(true),edit:(i,k)=>{ed[k]=i;er[k]={};draw()},cancel:(i,k)=>{ed[k]=null;er[k]={};draw()},
del:(i,k)=>{D[k]=D[k].filter(x=>x.id!=i);if(ed[k]==i)ed[k]=null;draw()},arch:(i,k)=>{const x=D[k].find(x=>x.id==i);x.arch=!x.arch;draw()},
sc:i=>{D.board.find(x=>x.id==i).score=+$('#sc'+i).value;toast('Đã lưu điểm');draw()},hd:i=>{const x=D.board.find(x=>x.id==i);x.hide=x.hide?0:1;draw()},
ac2:i=>sst(i,'completed'),rj:i=>sst(i,'rejected'),ask:i=>{rev={i:+i};er.fb='';draw()},cx:()=>{rev={};draw()},
view:i=>{mod=+i;ai3(+i)},close:()=>{mod=null;draw()},re3:()=>ai3(mod),raw:()=>$('#lg').scrollIntoView(),rep:()=>toast('Đã gửi báo cáo'),
sk2:()=>{ai.i={s:'skip'};draw()},re2:()=>{ai.i=null;draw()},re1:()=>ai1(ai.last||{}),man:()=>{ai.p={s:'edit',it:[]};draw()},
edp:()=>{ai.p={s:'edit',it:ai.p.it};draw()},edp2:()=>{ai.p={s:'edit',it:M.plan.it};draw()},acc:()=>F.pe({it:ai.p.it.join('\n')})};
const chk=(fs,d)=>{const e={};fs.forEach(x=>{const v=(d[x.n]||'').toString().trim();if(x.req&&!v)e[x.n]=x.l+' không được để trống.';else if(x.min&&!(+v>=x.min))e[x.n]=x.l+' phải là số dương.'});return e};
const F={
login:d=>{if(!d.email||!d.pw){er.login='Vui lòng nhập email và mật khẩu.';return draw()}er.login='';bz=true;draw();setTimeout(()=>{bz=false;if(d.pw.length<6){er.login='Sai email hoặc mật khẩu.';return draw()}const role=Object.keys(RL).find(k=>RL[k]==d.role)||'member',u=D.users.find(x=>x.email==d.email);U={name:u?u.name:d.email.split('@')[0],role};toast('Đăng nhập thành công');go(NAV[role][0][0])},400)},
register:d=>{const e=chk(REG,d);if(!e.pw&&d.pw.length<6)e.pw='Mật khẩu tối thiểu 6 ký tự.';er.reg=e;if(Object.keys(e).length)return draw();D.users.push({id:++nid,name:d.name,email:d.email,role:'Người tập',arch:false});toast('Tạo tài khoản thành công');go('login')},
onb:d=>{const e=chk(ONB,d);er.onb=e;if(Object.keys(e).length)return draw();M.goal=d.goal;M.n=+d.n;draw()},ai1,
pe:d=>{const it=d.it.split('\n').map(s=>s.trim()).filter(Boolean);if(!it.length){er.pe='Cần ít nhất 1 bài tập.';return draw()}er.pe='';if(M.plan){M.plan.it=it;const p=D.plans.find(x=>x.id==M.plan.pid);if(p){p.it=it;p.st='pending'}}else{const p={id:++nid,m:U.name,t:'Kế hoạch '+(M.goal||'cá nhân'),it,st:'pending'};D.plans.push(p);M.plan={it,pid:p.id}}ai.p=null;toast('Đã gửi huấn luyện viên duyệt');draw()},
fb:d=>{if(!d.note.trim()){er.fb='Nhận xét không được để trống.';return draw()}D.plans.find(p=>p.id==rev.i).note=d.note.trim();rev={};er.fb='';toast('Đã gửi yêu cầu sửa');draw()}};
const gen=(d,k)=>{const fs=FS[k],e=chk(fs,d);er[k]=e;if(Object.keys(e).length)return draw();fs.forEach(x=>{if(x.t=='number')d[x.n]=+d[x.n]});if(ed[k]!=null)Object.assign(D[k].find(x=>x.id==ed[k]),d);else D[k].push({id:++nid,...(DEF[k]||{}),...d});ed[k]=null;toast('Đã lưu');draw()};
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target,k=f.dataset.f;(F[k]||gen)(Object.fromEntries(new FormData(f)),k)});
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&A[b.dataset.a])A[b.dataset.a](b.dataset.i,b.dataset.k)});
document.addEventListener('input',e=>{if(e.target.id=='q'){q=e.target.value;$('#lst').innerHTML=mlist()}});
document.addEventListener('change',e=>{if(e.target.id=='fl'){fail=e.target.checked;draw(true)}});
draw();
</script>
