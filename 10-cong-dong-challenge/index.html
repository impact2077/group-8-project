<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="FitPlan Studio - quản lý challenge cộng đồng">
  <title>Challenge | FitPlan Studio</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <a class="logo" href="../01-trang-chu/index.html">FitPlan Studio</a>
    <nav class="main-nav" aria-label="Menu điều phối cộng đồng">
      <ul>
        <li><a class="tab active" href="index.html" aria-current="page">Challenge</a></li>
        <li><a class="tab" href="../11-cong-dong-leaderboard/index.html">Leaderboard</a></li>
        <li><a class="tab" href="../12-cong-dong-noi-dung/index.html">Nội dung</a></li>
      </ul>
    </nav>
    <div class="user-box">
      <span>Lan Điều Phối · Điều phối cộng đồng</span>
      <select class="role-switch" id="roleSwitch" aria-label="Chuyển vai trò nhanh" title="Chuyển vai trò nhanh"><option value="../04-nguoi-tap-dashboard/index.html">Người tập</option><option value="../07-coach-hoc-vien/index.html">Huấn luyện viên</option><option value="../10-cong-dong-challenge/index.html" selected>Điều phối cộng đồng</option><option value="../13-admin-bai-tap/index.html">Quản trị viên</option></select>
      <button type="button" class="btn btn-ghost" id="logoutBtn">Đăng xuất</button>
    </div>
  </header>

  <main class="container">
    <section class="page-title">
      <h1>Challenge</h1>
      <p>Tổng quan và quản lý thử thách</p>
    </section>

    <section class="stat-grid" id="stats" aria-label="Thống kê challenge"></section>
    <section class="card-box" aria-label="Biểu mẫu challenge">
      <h2 id="formTitle">Thêm challenge</h2>
      <form id="itemForm" novalidate>
        <div class="form-grid">
        <div class="field">
          <label for="f_name">Tên challenge</label>
          <input type="text" id="f_name" name="name">
          <span class="error-text" id="err_name"></span>
        </div>
        <div class="field">
          <label for="f_period">Thời gian</label>
          <input type="text" id="f_period" name="period">
          <span class="error-text" id="err_period"></span>
        </div>
        </div>
        <button type="submit" class="btn btn-primary" id="submitBtn">Thêm</button>
        <button type="button" class="btn btn-ghost" id="cancelBtn" hidden>Hủy</button>
      </form>
    </section>

    <section id="itemList" aria-label="Danh sách challenge"></section>
  </main>

  <div class="toast" id="toast" role="status"></div>

  <footer class="site-footer">
    <p>FitPlan Studio — BTL-29 ·
      <label class="fail-toggle"><input type="checkbox" id="failToggle"> Giả lập lỗi tải (xem trạng thái lỗi)</label>
    </p>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
