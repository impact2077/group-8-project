<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="FitPlan Studio - đăng nhập">
  <title>Đăng nhập | FitPlan Studio</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <a class="logo" href="index.html">FitPlan Studio</a>
    <div class="user-box">
      <a class="btn btn-ghost" href="#" data-soon>Đăng nhập</a>
      <a class="btn btn-primary" href="#" data-soon>Đăng ký</a>
    </div>
  </header>

  <main class="container">
    <section class="page-title">
      <h1>Đăng nhập</h1>
      <p>Truy cập tài khoản FitPlan Studio</p>
    </section>

    <section class="card-box auth-box" aria-label="Đăng nhập">
      <h2>Đăng nhập</h2>
      <form id="loginForm" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email">
          <span class="error-text" id="err_email"></span>
        </div>
        <div class="field">
          <label for="password">Mật khẩu</label>
          <input type="password" id="password" name="password" autocomplete="current-password">
          <span class="error-text" id="err_password"></span>
        </div>
        <div class="field">
          <label for="role">Vai trò (demo)</label>
          <select id="role" name="role">
            <option>Người tập</option>
            <option>Huấn luyện viên</option>
            <option>Điều phối cộng đồng</option>
            <option>Quản trị viên</option>
          </select>
        </div>
        <p class="form-error" id="formError" role="alert"></p>
        <button type="submit" class="btn btn-primary" id="loginBtn">Đăng nhập</button>
      </form>
      <p class="muted" id="loginResult" aria-live="polite">Mật khẩu bất kỳ từ 6 ký tự trở lên.</p>
    </section>
  </main>

  <div class="toast" id="toast" role="status"></div>

  <footer class="site-footer">
    <p>FitPlan Studio — BTL-29 ·
    </p>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
