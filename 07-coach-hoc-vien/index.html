<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="FitPlan Studio - danh sách học viên dành cho huấn luyện viên">
  <title>Danh sách học viên | FitPlan Studio</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <a class="logo" href="index.html">FitPlan Studio</a>
    <nav class="main-nav" aria-label="Menu huấn luyện viên">
      <ul>
        <li><a class="tab active" href="index.html" aria-current="page">Học viên</a></li>
        <li><a class="tab" href="#" data-soon>Duyệt kế hoạch</a></li>
        <li><a class="tab" href="#" data-soon>Template</a></li>
      </ul>
    </nav>
    <div class="user-box">
      <span>Coach Hùng · Huấn luyện viên</span>
      <button type="button" class="btn btn-ghost" id="logoutBtn">Đăng xuất</button>
    </div>
  </header>

  <main class="container">
    <section class="page-title">
      <h1>Danh sách học viên</h1>
      <p>Xem thông tin và tóm tắt tập luyện</p>
    </section>

    <section class="pending-box" aria-live="polite">
      <p>Có <strong id="pendingCount">0</strong> kế hoạch chờ duyệt.</p>
      <a class="btn btn-primary" href="#" data-soon>Đi duyệt</a>
    </section>

    <section class="filter-bar" aria-label="Tìm kiếm và lọc học viên">
      <div class="field">
        <label for="searchInput">Tìm học viên theo tên</label>
        <input type="search" id="searchInput" placeholder="Nhập tên học viên...">
      </div>
      <div class="field">
        <label for="goalSelect">Mục tiêu</label>
        <select id="goalSelect">
          <option value="">Tất cả</option>
          <option value="Giảm cân">Giảm cân</option>
          <option value="Tăng cơ">Tăng cơ</option>
          <option value="Duy trì">Duy trì</option>
        </select>
      </div>
    </section>

    <p class="result-count" id="resultCount" aria-live="polite"></p>
    <section class="member-grid" id="memberList" aria-label="Danh sách học viên"></section>
  </main>

  <div class="overlay" id="modal" hidden>
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modalName">
      <button type="button" class="modal-close" id="closeBtn" aria-label="Đóng">×</button>
      <h2 id="modalName"></h2>
      <p class="muted" id="modalGoal"></p>
      <h3 id="logTitle">Lịch sử log tập</h3>
      <div id="modalLogs"></div>
      <h3>Tóm tắt AI</h3>
      <div id="modalSummary"></div>
    </div>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <footer class="site-footer">
    <p>FitPlan Studio — BTL-29 ·
      <label class="fail-toggle"><input type="checkbox" id="failToggle"> Giả lập lỗi tải (xem trạng thái lỗi)</label>
    </p>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
