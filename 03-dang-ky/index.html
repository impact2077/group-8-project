<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="FitPlan Studio - tạo tài khoản">
  <title>Đăng ký | FitPlan Studio</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <a class="logo" href="index.html">FitPlan Studio</a>
    <div class="user-box">
      <a class="btn btn-ghost" href="#" data-soon>Đăng nhập</a>
      <a class="btn btn-primary" href="#" data-soon>Đăng ký</a>
    </div>
  </header>

  <main class="container">
    <section class="page-title">
      <h1>Đăng ký</h1>
      <p>Tạo tài khoản để bắt đầu tập luyện</p>
    </section>

    <section class="card-box auth-box" aria-label="Tạo tài khoản">
      <h2>Tạo tài khoản</h2>
      <form id="registerForm" novalidate>
        <div class="field">
          <label for="name">Họ tên</label>
          <input type="text" id="name" name="name" autocomplete="name">
          <span class="error-text" id="err_name"></span>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email">
          <span class="error-text" id="err_email"></span>
        </div>
        <div class="field">
          <label for="password">Mật khẩu</label>
          <input type="password" id="password" name="password" autocomplete="new-password">
          <span class="error-text" id="err_password"></span>
        </div>
        <button type="submit" class="btn btn-primary">Đăng ký</button>
      </form>
      <p class="muted" id="registerResult" aria-live="polite"></p>
    </section>
  </main>

  <div class="toast" id="toast" role="status"></div>

  <footer class="site-footer">
    <p>FitPlan Studio — BTL-29 ·
    </p>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
